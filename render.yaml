# Render Blueprint for the registration-number API.
# Docs: https://render.com/docs/blueprint-spec
#
# Persistent disks require a paid instance type, and a service with a disk
# runs as a single instance. Both are intentional: the JSON file store must
# have exactly one writer.
services:
  - type: web
    name: roll-number-api
    runtime: node
    rootDir: backend
    plan: starter
    region: singapore # change to the region closest to your users
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: roll-number-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Must live under the disk's mountPath, or data is lost on every deploy.
      - key: DATA_FILE_PATH
        value: /var/data/roll_numbers.json
      # Render terminates TLS at one proxy hop; needed for per-client rate limits.
      - key: TRUST_PROXY
        value: "1"
      - key: ROLL_NUMBER_PATTERN
        value: ^[A-Z0-9]{4,20}$
      # Random admin token generated by Render; read it in the dashboard.
      - key: ADMIN_API_KEY
        generateValue: true
      # Optional. If set, build the app with the same INGEST_API_KEY.
      - key: INGEST_API_KEY
        sync: false
